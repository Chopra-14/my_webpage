<!DOCTYPE html>
<html lang="en">
	<head>
		  <meta charset="UTF-8">
		    <meta name="viewport" content="width=device-width, initial-scale=1.0">
		      <title>Login Page</title>
		        <style>
    body {
	          font-family: Arial, sans-serif;
		        background: linear-gradient(135deg, #6a11cb, #2575fc);
			      display: flex;
			            justify-content: center;
				          align-items: center;
					        height: 100vh;
						      margin: 0;
						          }
        .login-container {
		      background: white;
		            padding: 30px;
			          border-radius: 10px;
				        box-shadow: 0px 4px 10px rgba(0,0,0,0.2);
					      width: 300px;
					            text-align: center;
						        }
	    h2 {
		          margin-bottom: 20px;
			        color: #333;
				    }
	        input {
			      width: 100%;
			            padding: 10px;
				          margin: 8px 0;
					        border: 1px solid #ccc;
						      border-radius: 5px;
						          }
		    button {
			          width: 100%;
				        padding: 10px;
					      background: #2575fc;
					            color: white;
						          border: none;
							        border-radius: 5px;
								      cursor: pointer;
								            font-size: 16px;
									        }
		        button:hover {
				      background: #1a5ed6;
				          }
			    p {
				          margin-top: 15px;
					        font-size: 14px;
						    }
			        a {
					      color: #2575fc;
					            text-decoration: none;
						        }
				    a:hover {
					          text-decoration: underline;
						      }
				      </style>
	</head>
	<body>
		  <div class="login-container">
			      <h2>Login</h2>
			          <form>
					        <input type="text" placeholder="Username" required>
						      <input type="password" placeholder="Password" required>
						            <button type="submit">Login</button>
							        </form>
								    <p>Don't have an account? <a href="#">Sign up</a></p>
								      </div>
	</body>
</html>
